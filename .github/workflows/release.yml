name: Portable Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, par exemple 0.1.0"
        required: true
        type: string

permissions:
  contents: write
  issues: read

jobs:
  package:
    # Stable 1.4/1.5/1.6 releases are published only from an explicitly approved
    # main merge commit; regular pushes never publish a release.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' &&
       (contains(github.event.head_commit.message, '[publish v1.4.0]') ||
        contains(github.event.head_commit.message, '[publish v1.5.0]') ||
        contains(github.event.head_commit.message, '[publish v1.6.0]')))
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/main") {
            if ("${{ contains(github.event.head_commit.message, '[publish v1.6.0]') }}" -eq "true") {
              $version = "1.6.0"
            }
            elseif ("${{ contains(github.event.head_commit.message, '[publish v1.5.0]') }}" -eq "true") {
              $version = "1.5.0"
            }
            else {
              $version = "1.4.0"
            }
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          }
          else {
            $version = "${{ github.ref_name }}"
          }

          $version = $version.Trim().TrimStart([char]"v")

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release version is empty."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify no open blocker issues
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $blockers = @(gh issue list --repo "${{ github.repository }}" --label blocker --state open --limit 100 --json number,title | ConvertFrom-Json)
          if ($blockers.Count -gt 0) {
            $summary = ($blockers | ForEach-Object { "#$($_.number) $($_.title)" }) -join "; "
            throw "Release blocked by open blocker issue(s): $summary"
          }

      - name: Gate stable maintenance 1.2 until human qualification
        if: ${{ startsWith(steps.version.outputs.version, '1.2.') && !contains(steps.version.outputs.version, '-') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $required = @(97, 106, 107, 108, 109, 110, 111, 112)
          $openIssues = @(gh issue list --repo "${{ github.repository }}" --state open --limit 500 --json number | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read issue states: maintenance 1.2 release is blocked."
          }
          $openIds = @($openIssues | ForEach-Object { [int]$_.number })
          $pending = @($required | Where-Object { $openIds -contains $_ })
          if ($pending.Count -gt 0) {
            throw "Stable maintenance 1.2 release blocked: open EPIC / qualification issues #$($pending -join ', #'). Publish a release candidate for Windows validation instead."
          }

      - name: Gate stable impact-analysis 1.4 until all issues are completed
        if: ${{ steps.version.outputs.version == '1.4.0' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $required = @(98, 113, 114, 115, 116, 117, 118, 119, 120, 121)
          foreach ($number in $required) {
            $issue = gh api "repos/${{ github.repository }}/issues/$number" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $issue.state -ne 'closed') {
              throw "Nodalis 1.4.0 release blocked: issue #$number is not confirmed closed."
            }
          }

      - name: Gate stable dynamic views 1.5 against validated issues
        if: ${{ steps.version.outputs.version == '1.5.0' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $required = @(125, 128, 129, 130, 131, 132, 133, 134)
          foreach ($number in $required) {
            $issue = gh api "repos/${{ github.repository }}/issues/$number" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $issue.state -ne 'closed') {
              throw "Nodalis 1.5.0 release blocked: issue #$number is not closed."
            }
          }

      - name: Gate stable composite documents 1.6 against accepted issues
        if: ${{ steps.version.outputs.version == '1.6.0' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $required = @(126, 135, 136, 137, 138, 139, 140, 141)
          foreach ($number in $required) {
            $issue = gh api "repos/${{ github.repository }}/issues/$number" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $issue.state -ne 'closed') {
              throw "Nodalis 1.6.0 release blocked: issue #$number is not closed."
            }
          }

      - name: Verify local-only constraints
        shell: pwsh
        run: ./scripts/verify-constraints.ps1

      - name: Verify WPF accessibility baseline
        shell: pwsh
        run: ./scripts/verify-accessibility.ps1

      - name: Restore
        run: dotnet restore Nodalis.sln

      - name: Build
        run: dotnet build Nodalis.sln --configuration Release --no-restore

      - name: Run zero-dependency regression suite
        run: dotnet run --project tests/Nodalis.SmokeTests/Nodalis.SmokeTests.csproj --configuration Release

      - name: Build portable package
        shell: pwsh
        run: ./scripts/publish-portable.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify reproducible portable package
        shell: pwsh
        run: ./scripts/verify-release-reproducibility.ps1 -Version "${{ steps.version.outputs.version }}" -BaselineArchive "artifacts/Nodalis-win-x64.zip"

      - name: Start published portable binary against RC workspace
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "Nodalis-RC-Workspace"
          if (Test-Path $workspace) {
            Remove-Item $workspace -Recurse -Force
          }
          Copy-Item "tests/ReleaseCandidateWorkspace" -Destination $workspace -Recurse -Force
          $arguments = "--smoke-test --smoke-test-workspace `"$workspace`""
          $process = Start-Process "artifacts/Nodalis-win-x64/Nodalis.exe" -ArgumentList $arguments -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Published Nodalis.exe failed RC workspace smoke test with exit code $($process.ExitCode)."
          }

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Nodalis-win-x64-${{ steps.version.outputs.version }}
          path: |
            artifacts/Nodalis-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create annotated stable tag from the accepted main commit
        if: ${{ github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[publish v1.4.0]') || contains(github.event.head_commit.message, '[publish v1.5.0]') || contains(github.event.head_commit.message, '[publish v1.6.0]')) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The GitHub App integration cannot create tag refs directly.
          # Create one annotated Git tag from the verified release commit.
          $tag = "v${{ steps.version.outputs.version }}"
          $existing = gh api "repos/${{ github.repository }}/git/ref/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists: refusing to move or duplicate a release tag."
          }
          $message = if ($tag -eq "v1.6.0") {
            "Nodalis 1.6.0 - Documents composites Markdown : inclusions et sections canoniques, preview, impression, exports locaux, securite et regressions verifiees."
          } elseif ($tag -eq "v1.5.0") {
            "Nodalis v1.5.0 - Vues dynamiques : requetes typees, favoris, dashboard, pagination, mise a jour incrementale et sources canoniques. Release qualifiee."
          } else {
            "Nodalis 1.4.0 - Analyse d'impact : graphe WPF navigable, liens aux incidents et interventions, index incrémental et documentation utilisateur. CI et recette validées."
          }
          $tagObject = gh api -X POST "repos/${{ github.repository }}/git/tags" -f tag=$tag -f message=$message -f object="${{ github.sha }}" -f type=commit | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagObject.sha)) {
            throw "Unable to create annotated tag object $tag."
          }
          gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$($tagObject.sha)"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create Git ref for $tag."
          }

      - name: Publish GitHub release with detailed notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[publish v1.4.0]') || contains(github.event.head_commit.message, '[publish v1.5.0]') || contains(github.event.head_commit.message, '[publish v1.6.0]'))) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          if ($version -eq "1.4.0") {
            gh release create $tag "artifacts/Nodalis-win-x64.zip" "artifacts/SHA256SUMS.txt" --title "Nodalis v1.4.0 — Analyse d'impact" --notes-file "docs/release-notes-1.4.md" --verify-tag
          }
          elseif ($version -eq "1.5.0") {
            gh release create $tag "artifacts/Nodalis-win-x64.zip" "artifacts/SHA256SUMS.txt" --title "Nodalis v1.5.0 — Vues dynamiques" --notes-file "docs/release-notes-1.5.md" --verify-tag
          }
          elseif ($version -eq "1.6.0") {
            gh release create $tag "artifacts/Nodalis-win-x64.zip" "artifacts/SHA256SUMS.txt" --title "Nodalis v1.6.0 — Documents composites" --notes-file "docs/release-notes-1.6.md" --verify-tag
          }
          else {
            gh release create $tag "artifacts/Nodalis-win-x64.zip" "artifacts/SHA256SUMS.txt" --title "Nodalis $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed for $tag."
          }
