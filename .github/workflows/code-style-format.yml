name: One-time C# whitespace cleanup

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nodalis.sln

      - name: Remove invalid void return documentation
        shell: pwsh
        run: |
          $pattern = '(?m)^[ \t]*/// <returns>The result of the operation\.</returns>\r?\n(?=[ \t]*(?:(?:public|private|protected|internal|static|async|virtual|override|sealed|new|unsafe|partial|extern)\s+)*void\b)'
          Get-ChildItem -Path src -Recurse -Filter *.cs | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName)
            $updated = [System.Text.RegularExpressions.Regex]::Replace($content, $pattern, '')
            if ($updated -ne $content) {
              [System.IO.File]::WriteAllText(
                $_.FullName,
                $updated,
                [System.Text.UTF8Encoding]::new($false))
            }
          }

      - name: Normalize C# whitespace
        run: dotnet format whitespace Nodalis.sln --no-restore

      - name: Verify C# code style
        run: dotnet run --project tools/Nodalis.CodeStyle/Nodalis.CodeStyle.csproj --configuration Release -- --check

      - name: Build
        run: dotnet build Nodalis.sln --configuration Release --no-restore

      - name: Run smoke tests
        run: dotnet run --project tests/Nodalis.SmokeTests/Nodalis.SmokeTests.csproj --configuration Release

      - name: Commit formatting
        shell: pwsh
        run: |
          # Formatting can run concurrently with newer develop commits. Only
          # the latest checked-out tree may publish a formatting commit.
          git add -- '*.cs'
          if (-not (git diff --cached --name-only)) {
            Write-Host "No tracked C# formatting changes were required."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(style): normalize C# formatting after documentation cleanup"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $expectedBase = (git rev-parse HEAD^).Trim()
          git fetch origin develop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $remoteHead = (git rev-parse origin/develop).Trim()
          if ($remoteHead -ne $expectedBase) {
            Write-Host "Develop advanced during formatting; a newer run will normalize the latest tree."
            exit 0
          }

          git push origin HEAD:develop
          if ($LASTEXITCODE -ne 0) {
            # A concurrent developer push is not a formatting failure. If
            # develop advanced, its own workflow will check the newer tree.
            git fetch origin develop
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $newHead = (git rev-parse origin/develop).Trim()
            if ($newHead -ne $expectedBase) {
              Write-Host "Concurrent develop update; skipping obsolete formatting push."
              exit 0
            }

            # Preserve real authentication/remote failures.
            exit 1
          }
